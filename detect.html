<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRATER - Detect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6', secondary: '#1e293b', accent: '#f97316', dark: '#0f172a' }, fontFamily: { sans: ['Inter','sans-serif'] } } } };
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-dark min-h-screen">
  <nav class="fixed top-0 left-0 right-0 z-50 bg-dark/90 backdrop-blur-sm shadow-lg py-4">
    <div class="container mx-auto px-4 flex justify-between items-center">
      <div class="text-2xl font-bold text-white"><span class="gradient-text"><a href="./">C.R.A.T.E.R</a></span></div>
      <div class="hidden md:flex space-x-8">
        <a href="./#section1" class="nav-link text-gray-300 hover:text-white font-medium">AI Detection</a>
        <a href="./#section2" class="nav-link text-gray-300 hover:text-white font-medium">Data Analysis</a>
        <a href="./#section3" class="nav-link text-gray-300 hover:text-white font-medium">Repairs</a>
        <a href="./#section4" class="nav-link text-gray-300 hover:text-white font-medium">Implementation</a>
      </div>
    </div>
  </nav>

  <main class="container mx-auto px-4 pt-28 pb-16">
    <h1 class="text-3xl md:text-4xl font-bold text-white mb-6"><span class="gradient-text">Pothole Detection</span></h1>
    <div class="grid md:grid-cols-3 gap-6">
      <div class="md:col-span-2 bg-slate-900/60 border border-slate-800 rounded-xl p-4">
        <div class="relative aspect-video bg-black rounded-lg overflow-hidden">
          <video id="video" class="absolute inset-0 w-full h-full object-contain" autoplay playsinline muted></video>
          <canvas id="overlay" class="absolute inset-0 w-full h-full"></canvas>
        </div>
        <div class="mt-4 flex flex-wrap gap-3 items-center">
          <button id="btnStart" class="bg-primary hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-medium flex items-center"><i class="fa-solid fa-video mr-2"></i> Start Camera</button>
          <button id="btnDetect" disabled class="border-2 border-primary text-primary hover:bg-blue-500/10 px-4 py-2 rounded-lg font-medium flex items-center"><i class="fa-solid fa-bullseye mr-2"></i> Start Detection</button>
          <button id="btnStop" disabled class="border-2 border-red-400 text-red-400 hover:bg-red-500/10 px-4 py-2 rounded-lg font-medium flex items-center"><i class="fa-solid fa-stop mr-2"></i> Stop</button>
          <button id="btnDownload" class="ml-auto bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-medium flex items-center"><i class="fa-solid fa-download mr-2"></i> Download CSV</button>
        </div>
        <p id="status" class="mt-3 text-sm text-gray-300">Idle</p>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4">
        <h2 class="text-xl font-semibold text-white mb-3 flex items-center"><i class="fa-solid fa-location-crosshairs text-blue-400 mr-2"></i> GPS + System</h2>
        <div class="space-y-2 text-sm text-gray-300">
          <div>GPS: <span id="gpsStatus" class="text-yellow-400">requesting...</span></div>
          <div>Lat: <span id="lat">—</span></div>
          <div>Lon: <span id="lon">—</span></div>
          <div>Accuracy: <span id="acc">—</span></div>
          <div>Detections: <span id="detCount">0</span></div>
          <div class="pt-2">API: <span id="apiStatus" class="text-yellow-400">checking...</span></div>
        </div>
        <h2 class="text-xl font-semibold text-white mt-6 mb-2 flex items-center"><i class="fa-solid fa-list text-cyan-400 mr-2"></i> Log</h2>
        <div class="max-h-72 overflow-auto border border-slate-800 rounded-lg">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-800 text-gray-300 sticky top-0"><tr><th class="px-3 py-2">Timestamp</th><th class="px-3 py-2">Latitude</th><th class="px-3 py-2">Longitude</th><th class="px-3 py-2">Confidence</th></tr></thead>
            <tbody id="logBody" class="divide-y divide-slate-800 text-gray-200"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const statusEl = document.getElementById('status');
    const apiStatusEl = document.getElementById('apiStatus');
    const gpsStatusEl = document.getElementById('gpsStatus');
    const latEl = document.getElementById('lat');
    const lonEl = document.getElementById('lon');
    const accEl = document.getElementById('acc');
    const detCountEl = document.getElementById('detCount');
    const btnStart = document.getElementById('btnStart');
    const btnDetect = document.getElementById('btnDetect');
    const btnStop = document.getElementById('btnStop');
    const btnDownload = document.getElementById('btnDownload');
    const logBody = document.getElementById('logBody');

    const API_DETECT = `${location.origin}/api/detect`;
    const API_LOG = `${location.origin}/api/log`;
    const API_PING = `${location.origin}/ping`;

    let stream = null;
    let detecting = false;
    let rafId = null;
    let apiAvailable = false;
    let lastPos = null;
    let detCount = 0;
    const logs = [];

    async function startCamera() {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      video.srcObject = stream;
      await new Promise(r => video.onloadedmetadata = r);
      overlay.width = video.videoWidth || 1280;
      overlay.height = video.videoHeight || 720;
      statusEl.textContent = 'Camera ready';
      btnDetect.disabled = false;
      btnStop.disabled = false;
    }

    async function pingApi() {
      try { const r = await fetch(API_PING, { cache: 'no-store' }); apiAvailable = r.ok; }
      catch { apiAvailable = false; }
      apiStatusEl.textContent = apiAvailable ? 'online' : 'offline (fallback)';
      apiStatusEl.className = apiAvailable ? 'text-emerald-400' : 'text-yellow-400';
    }
    pingApi();

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(p => {
        const { latitude, longitude, accuracy } = p.coords;
        lastPos = { latitude, longitude, accuracy };
        gpsStatusEl.textContent = 'ok';
        gpsStatusEl.className = 'text-emerald-400';
        latEl.textContent = latitude.toFixed(6);
        lonEl.textContent = longitude.toFixed(6);
        accEl.textContent = `${Math.round(accuracy)} m`;
      }, err => { gpsStatusEl.textContent = err.message || 'denied'; gpsStatusEl.className = 'text-red-400'; }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 });
    } else { gpsStatusEl.textContent = 'not supported'; gpsStatusEl.className = 'text-red-400'; }

    btnStart.addEventListener('click', () => startCamera().catch(e => statusEl.textContent = 'Camera error: ' + e.message));
    btnDetect.addEventListener('click', () => { if (stream) { detecting = true; statusEl.textContent = 'Detecting...'; btnDetect.disabled = true; detectLoop(); } });
    btnStop.addEventListener('click', () => { detecting = false; if (rafId) cancelAnimationFrame(rafId); statusEl.textContent = 'Stopped'; btnDetect.disabled = false; ctx.clearRect(0,0,overlay.width,overlay.height); });

    async function detectLoop() {
      if (!detecting) return;
      try {
        const off = document.createElement('canvas');
        off.width = overlay.width; off.height = overlay.height;
        const octx = off.getContext('2d');
        octx.drawImage(video, 0, 0, off.width, off.height);
        const blob = await new Promise(res => off.toBlob(res, 'image/jpeg', 0.8));

        let detections = [];
        if (apiAvailable) {
          const form = new FormData(); form.append('image', blob, 'frame.jpg');
          const resp = await fetch(API_DETECT, { method: 'POST', body: form });
          if (resp.ok) { const data = await resp.json(); detections = Array.isArray(data.detections) ? data.detections : []; }
          else if (resp.status === 404) { apiAvailable = false; apiStatusEl.textContent = 'offline (fallback)'; apiStatusEl.className = 'text-yellow-400'; }
        }

        ctx.clearRect(0, 0, overlay.width, overlay.height);
        let found = false;
        for (const d of detections) {
          const { bbox = [], confidence = 0, cls = 'pothole' } = d;
          if (!Array.isArray(bbox) || bbox.length !== 4) continue;
          const [x1, y1, x2, y2] = bbox;
          ctx.strokeStyle = 'rgba(59,130,246,0.9)'; ctx.lineWidth = 3;
          ctx.strokeRect(x1, y1, (x2 - x1), (y2 - y1));
          const label = `${cls} ${(confidence * 100).toFixed(1)}%`;
          ctx.fillStyle = 'rgba(59,130,246,0.9)'; ctx.font = '14px Inter, sans-serif';
          const tw = ctx.measureText(label).width + 10;
          ctx.fillRect(x1, Math.max(0, y1 - 22), Math.max(60, tw), 22);
          ctx.fillStyle = '#fff'; ctx.fillText(label, x1 + 5, Math.max(14, y1 - 6));
          found = true;
        }

        if (found && lastPos) {
          const entry = { timestamp: new Date().toISOString(), lat: lastPos.latitude, lon: lastPos.longitude, accuracy: lastPos.accuracy ?? null, confidence: detections[0]?.confidence ?? null };
          logs.push(entry); detCount += 1; detCountEl.textContent = String(detCount); appendRow(entry);
          try { if (apiAvailable) await fetch(API_LOG, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(entry) }); } catch {}
        }

        await new Promise(r => setTimeout(r, 500));
      } catch (e) { statusEl.textContent = 'Detection error: ' + e.message; console.error(e); }
      finally { if (detecting) rafId = requestAnimationFrame(detectLoop); }
    }

    function appendRow(e) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="px-3 py-2 whitespace-nowrap">${e.timestamp}</td><td class="px-3 py-2">${Number(e.lat).toFixed(6)}</td><td class="px-3 py-2">${Number(e.lon).toFixed(6)}</td><td class="px-3 py-2">${e.confidence!=null?(e.confidence*100).toFixed(1)+'%':'—'}</td>`;
      logBody.prepend(tr);
    }

    btnDownload.addEventListener('click', () => {
      const header = ['timestamp','lat','lon','accuracy','confidence'];
      const rows = logs.map(l => [l.timestamp,l.lat,l.lon,l.accuracy ?? '',l.confidence ?? '']);
      const csv = [header, ...rows].map(r => r.map(v => typeof v === 'string' ? '"' + v.replaceAll('"','""') + '"' : v).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = `pothole_detections_${new Date().toISOString().replace(/[:.]/g,'-')}.csv`;
      a.click(); URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
