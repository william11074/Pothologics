<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRATER • Repair Routes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
</head>

<body class="bg-dark min-h-screen">
  <nav class="fixed top-0 left-0 right-0 z-50 bg-dark/90 backdrop-blur-sm shadow-lg py-4">
    <div class="container mx-auto px-4 flex justify-between items-center">
      <div class="text-2xl font-bold text-white"><span class="gradient-text"><a href="./">C.R.A.T.E.R</a></span></div>
      <div class="hidden md:flex space-x-8">
        <a href="./#section1" class="nav-link text-gray-300 hover:text-white font-medium">AI Detection</a>
        <a href="./#section2" class="nav-link text-gray-300 hover:text-white font-medium">Data Analysis</a>
      </div>
    </div>
  </nav>

  <main class="container mx-auto px-4 pt-28 pb-6">
    <h1 class="text-3xl md:text-4xl font-bold text-white mb-4"><span class="gradient-text">Repair Routes</span></h1>
    <p class="text-gray-300 mb-4">Loads generated repair routes and plots them onto this interactive map.</p>

    <!-- Mobile toggle for filter/legend panel -->
    <button id="btnTogglePanel" class="lg:hidden mb-3 inline-flex items-center gap-2 bg-primary hover:bg-blue-500 text-white px-3 py-2 rounded-lg">
      <i class="fa-solid fa-sliders"></i>
      <span>Filters & Legend</span>
    </button>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
      <!-- Controls -->
      <div id="panel" class="hidden lg:block lg:col-span-1 bg-slate-900/60 border border-slate-800 rounded-xl p-4 space-y-4">
        <div class="space-y-2">
          <div class="flex items-center justify-between gap-2">
            <div id="status" class="text-sm text-gray-300 flex items-center gap-2">
              <span id="spinner"
                class="hidden w-3 h-3 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></span>
              <span id="statusText">Loading routes…</span>
            </div>
            <div class="flex items-center gap-2">
              <span id="sseDot" class="inline-block w-2.5 h-2.5 rounded-full bg-yellow-400" title="Live updates"></span>
              <button id="btnReload" class="text-xs px-2 py-1 rounded bg-slate-800 hover:bg-slate-700">Reload</button>
            </div>
          </div>
          <div id="toasts" class="fixed top-20 left-1/2 -translate-x-1/2 z-[1000] space-y-2"></div>
        </div>

        <div class="border-t border-slate-800 pt-3">
          <h2 class="text-white font-semibold mb-2">Filters</h2>
          <label class="block text-gray-300 text-sm mt-3 mb-1">Route</label>
          <select id="routeFilter" class="w-full bg-slate-800 text-gray-200 rounded-lg px-2 py-1">
            <option value="">All</option>
          </select>
          <div class="mt-3 flex items-center gap-2">
            <input id="chkDetections" type="checkbox" checked class="accent-blue-500">
            <label for="chkDetections" class="text-gray-300 text-sm">Show detections</label>
          </div>
        </div>

        <div class="border-t border-slate-800 pt-3">
          <h2 class="text-white font-semibold mb-2">Legend</h2>
          <div class="mb-2 flex items-center justify-end">
            <button id="btnResetAllColors" class="text-xs px-2 py-1 rounded bg-slate-800 hover:bg-slate-700">Reset All
              Colors</button>
          </div>
          <div id="legend" class="space-y-1 text-sm text-gray-300 max-h-64 overflow-y-auto"></div>
        </div>
      </div>

      <div class="lg:col-span-3">
        <div id="map" class="w-full h-[65vh] sm:h-[70vh] rounded-xl border border-slate-800"></div>
      </div>
    </div>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const spinnerEl = document.getElementById('spinner');
    const btnReload = document.getElementById('btnReload');
    const sseDot = document.getElementById('sseDot');
    const toasts = document.getElementById('toasts');
    const routeFilter = document.getElementById('routeFilter');
    const legend = document.getElementById('legend');
    const chkDetections = document.getElementById('chkDetections');
    let workOrdersMeta = { source_path: null, source_csv: null };

    // generate leaflet map
    const map = L.map('map').setView([37.7749, -122.4194], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // make sure that the routes are on top of the detections so that they are more visible
    map.createPane('detections');
    map.getPane('detections').style.zIndex = 390;
    map.createPane('routes');
    map.getPane('routes').style.zIndex = 410;

    const DEFAULT_ROUTE_COLOR = '#1f77b4';
    let savedRouteColors = {};
    let routeLayers = new Map(); 
    let currentData = null; 
    let currentGrouped = new Map(); 
    const detectionsLayer = L.layerGroup(undefined, { pane: 'detections' }).addTo(map);
    let detMarkers = [];

    // reset map for updates
    function clearMap() {
      for (const [, obj] of routeLayers) {
        map.removeLayer(obj.polyline);
        obj.markers.forEach(m => map.removeLayer(m));
      }
      routeLayers.clear();
    }

    function updateDetectionMarkerSizes() {
      const z = map.getZoom ? map.getZoom() : 13;
      const scale = Math.pow(1.2, (z - 13)); // shrink when zoomed out, grow when zoomed in
      detMarkers.forEach(({ marker, baseRadius }) => {
        const r = Math.max(2, Math.min(12, baseRadius * scale));
        try { marker.setStyle({ radius: r }); } catch (e) { }
      });
    }
    map.on('zoomend', updateDetectionMarkerSizes);

    function showToast(message, type = 'info') {
      const el = document.createElement('div');
      const colors = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-700';
      el.className = `${colors} text-white px-3 py-2 rounded shadow`;
      el.textContent = message;
      toasts.appendChild(el);
      setTimeout(() => { el.remove(); }, 3000);
    }

    function setSpinner(on) { spinnerEl.classList.toggle('hidden', !on); }

    // filters for different routes, in the future can be implemented to add more types of filters
    function buildFilters(data) {
      const routes = Array.from(new Set(data.map(r => String(r.route_id)))).sort((a, b) => Number(a) - Number(b));
      routeFilter.innerHTML = '<option value="">All</option>' + routes.map(r => `<option value="${r}">${r}</option>`).join('');
    }

    function applyFilters(data) {
      const route = routeFilter.value;
      return data.filter(r => (!route || String(r.route_id) === String(route)));
    }

    // Shows main functionalities of legend such as different routes, route colors, etc.
    function renderLegendSummary() {
      legend.innerHTML = '';
      Array.from(currentGrouped.keys()).sort((a, b) => a - b).forEach((routeId) => {
        const pts = currentGrouped.get(routeId) || [];
        const csvColor = (pts[0] && pts[0].route_color) ? String(pts[0].route_color) : null;
        const color = (routeLayers.get(routeId) || {}).color || savedRouteColors[String(routeId)] || csvColor || DEFAULT_ROUTE_COLOR;
        const stats = pts[0] || {};
        const km = stats.total_km ?? '—';
        const mins = stats.total_time_mins ?? '—';
        const row = document.createElement('div');
        row.className = 'hover:text-white flex items-center justify-between gap-2';
        row.innerHTML = `
          <span class="flex-1 cursor-pointer select-none" data-route="${routeId}">
            <span class="inline-block w-3 h-3 mr-2 rounded align-middle" style="background:${color}"></span>
            <span class="text-gray-200 align-middle">Route ${routeId} • ${km} km • ${mins} mins</span>
          </span>
          <div class="flex items-center gap-1">
            <input type="color" value="${color}" data-color-for="${routeId}" class="w-8 h-6 p-0 border border-slate-700 rounded bg-slate-800" />
            <button class="text-xs px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700" data-reset-for="${routeId}">Reset</button>
          </div>
        `;
        // click on label opens details
        row.querySelector('[data-route]')?.addEventListener('click', () => { renderRouteDetails(routeId); fitRoute(routeId); });
        // input: live preview only (no server write)
        row.querySelector('[data-color-for]')?.addEventListener('input', (e) => {
          const newColor = e.target.value;
          savedRouteColors[String(routeId)] = newColor;
          const obj = routeLayers.get(routeId);
          if (obj) {
            try { obj.polyline.setStyle({ color: newColor }); } catch (err) { }
            obj.markers.forEach(m => { try { m.setStyle({ color: newColor, fillColor: newColor }); } catch (err) { } });
            obj.color = newColor;
          }
          renderLegendSummary();
        });
        // change: persist to server and show notification
        row.querySelector('[data-color-for]')?.addEventListener('change', async (e) => {
          const newColor = e.target.value;
          try {
            setSpinner(true);
            const resp = await fetch('/api/routes/colors', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ route_id: routeId, color: newColor })
            });
            if (!resp.ok) throw new Error('Save failed');
            showToast(`Saved color for Route ${routeId}`, 'success');
          } catch (_) {
            showToast('Failed to save color', 'error');
          } finally {
            setSpinner(false);
          }
        });
        row.querySelector('[data-reset-for]')?.addEventListener('click', () => {
          const defColor = DEFAULT_ROUTE_COLOR;
          savedRouteColors[String(routeId)] = defColor;
          const obj = routeLayers.get(routeId);
          if (obj) {
            try { obj.polyline.setStyle({ color: defColor }); } catch (err) { }
            obj.markers.forEach(m => { try { m.setStyle({ color: defColor, fillColor: defColor }); } catch (err) { } });
            obj.color = defColor;
          }
          fetch('/api/routes/colors', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ route_id: routeId, color: defColor }) }).catch(() => { });
          renderLegendSummary();
          showToast(`Reset color for Route ${routeId}`, 'info');
        });
        legend.appendChild(row);
      });
    }

    // zoom in to a specific route
    function fitRoute(routeId) {
      const pts = (currentGrouped.get(routeId) || []).map(p => [parseFloat(p.latitude), parseFloat(p.longitude)]).filter(ll => Number.isFinite(ll[0]) && Number.isFinite(ll[1]));
      if (!pts.length) return;
      const bounds = L.latLngBounds(pts);
      map.fitBounds(bounds, { padding: [20, 20] });
    }

    // Route details on legend
    function renderRouteDetails(routeId) {
      const pts = (currentGrouped.get(routeId) || []).slice().sort((a, b) => Number(a.route_order) - Number(b.route_order));
      const csvColor = (pts[0] && pts[0].route_color) ? String(pts[0].route_color) : null;
      const color = (routeLayers.get(routeId) || {}).color || savedRouteColors[String(routeId)] || csvColor || DEFAULT_ROUTE_COLOR;
      const stats = pts[0] || {};
      const km = stats.total_km ?? '—';
      const mins = stats.total_time_mins ?? '—';
      const header = `
        <div class="mb-2 flex items-center flex-wrap gap-2">
          <button id="btnBackLegend" class="text-xs px-2 py-1 rounded bg-slate-800 hover:bg-slate-700">Back</button>
          <button id="btnZoomRoute" class="text-xs px-2 py-1 rounded bg-slate-800 hover:bg-slate-700">Zoom</button>
          <span class="inline-block w-3 h-3 rounded" style="background:${color}"></span>
          <span class="font-semibold">Route ${routeId}</span>
          <span class="text-gray-400">• ${km} km • ${mins} mins</span>
          <span class="ml-auto flex items-center gap-2">
            <label class="text-xs text-gray-300">Dataset</label>
            <select id="datasetSelect" class="text-xs bg-slate-800 text-gray-200 rounded px-1 py-0.5">
              <option value="simulated" selected>Simulated</option>
              <option value="real">Real</option>
            </select>
            <button id="btnMarkComplete" class="text-xs px-2 py-1 rounded bg-blue-600 hover:bg-blue-500 text-white">Mark Complete</button>
          </span>
        </div>`;
      const rows = pts.map((p, i) => `<div class="py-1 border-b border-slate-800/50 text-gray-200"><span class="text-gray-400 mr-2">#${i + 1}</span>${Number(p.latitude).toFixed(5)}, ${Number(p.longitude).toFixed(5)}<span class="ml-2 text-gray-400">${p.severity ? 'Severity: ' + p.severity : ''}</span>${p.report_date ? `<span class=\"ml-2 text-gray-400\">Reported: ${p.report_date}</span>` : ''}</div>`).join('');
      legend.innerHTML = header + `<div>${rows || '<div class="text-gray-400">No stops</div>'}</div>`;
      try {
        const dsSelInit = document.getElementById('datasetSelect');
        if (dsSelInit) {
          const defSrc = ((workOrdersMeta.source_path || workOrdersMeta.source_csv || '') + '').toLowerCase().includes('detections.csv') ? 'real' : 'simulated';
          dsSelInit.value = defSrc;
        }
      } catch (e) { /* ignore */ }
      document.getElementById('btnBackLegend')?.addEventListener('click', () => renderLegendSummary());
      document.getElementById('btnZoomRoute')?.addEventListener('click', () => fitRoute(routeId));
      document.getElementById('btnMarkComplete')?.addEventListener('click', async () => {
        try {
          const btn = document.getElementById('btnMarkComplete');
          const ds = document.getElementById('datasetSelect');
          btn.disabled = true; btn.textContent = 'Submitting…';
          statusEl.textContent = `Marking route ${routeId} complete…`;
          const source = ds?.value || 'simulated';
          const resp = await fetch('/api/routes/fix', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ route_id: routeId, source })
          });
          const j = await resp.json();
          if (!resp.ok) throw new Error(j?.error || 'Request failed');
          statusEl.textContent = `Route ${routeId} marked complete. Removed ${j.removed} detections.`;
          // Reload routes after server rebuild (SSE will also refresh)
          setTimeout(() => loadDefault(), 500);
        } catch (e) {
          statusEl.textContent = `Failed to mark complete: ${e}`;
        } finally {
          const btn = document.getElementById('btnMarkComplete');
          if (btn) { btn.disabled = false; btn.textContent = 'Mark Complete'; }
        }
      });
    }

    function plotRoutes(data) {
      clearMap();
      if (!data.length) return;
      const filtered = applyFilters(data);
      currentGrouped = new Map();
      filtered.forEach(r => {
        const id = r.route_id;
        if (!currentGrouped.has(id)) currentGrouped.set(id, []);
        currentGrouped.get(id).push(r);
      });

      let bounds = [];
      legend.innerHTML = '';

      Array.from(currentGrouped.keys()).sort((a, b) => a - b).forEach((routeId, idx) => {
        const pts = currentGrouped.get(routeId).sort((a, b) => Number(a.route_order) - Number(b.route_order));
        const csvColor = (pts[0] && pts[0].route_color) ? String(pts[0].route_color) : null;
        const color = savedRouteColors[String(routeId)] || csvColor || DEFAULT_ROUTE_COLOR;
        const latlngs = pts.map(p => [parseFloat(p.latitude), parseFloat(p.longitude)]);
        if (latlngs.length === 0) return;
        const line = L.polyline(latlngs, { color, weight: 4, opacity: 0.95, pane: 'routes' }).addTo(map);
        line.on('click', () => {
          // Bounce the legend to route details and emphasize selected line
          renderRouteDetails(routeId);
          fitRoute(routeId);
          try { line.bringToFront(); } catch (e) { }
          line.setStyle({ weight: 5, opacity: 1.0 });
          setTimeout(() => line.setStyle({ weight: 3, opacity: 0.8 }), 800);
        });
        const markers = pts.map((p, i) => {
          const m = L.circleMarker([parseFloat(p.latitude), parseFloat(p.longitude)], { radius: 5, color, fillColor: color, fillOpacity: 0.85, pane: 'routes' }).addTo(map);
          const sev = p.severity ?? 'N/A';
          const rep = p.report_date ?? 'N/A';
          m.bindPopup(`<div><b>Route ${routeId}</b><br>#${i + 1}<br>Severity: ${sev}<br>Report: ${rep}</div>`);
          return m;
        });
        routeLayers.set(routeId, { polyline: line, markers, color });
        latlngs.forEach(ll => bounds.push(ll));
      });

      if (bounds.length) map.fitBounds(bounds, { padding: [20, 20] });
      renderLegendSummary();
    }

    function parseCsvText(text) {
      const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
      const rows = parsed.data.map(r => {
        const ridRaw = r.route_id ?? r.Route_ID ?? r.route ?? r.RouteId;
        const rid = ridRaw != null && ridRaw !== '' ? String(ridRaw).trim() : null;
        const rorderRaw = r.route_order ?? r.Order ?? r.order;
        const rorder = rorderRaw != null && rorderRaw !== '' ? Number(rorderRaw) : null;
        return {
        route_id: rid,
        route_order: rorder,
        latitude: r.latitude ?? r.lat,
        longitude: r.longitude ?? r.lon,
        route_color: r.route_color,
        severity: r.severity,
        report_date: r.report_date,
        total_km: r.total_km,
        total_time_mins: r.total_time_mins,
      }});
      return rows.filter(r => r.route_id != null && r.latitude != null && r.longitude != null);
    }

    async function loadDefault() {
      statusText.textContent = 'Loading work_orders.csv…';
      try {
        const resp = await fetch('/work_orders.csv', { cache: 'no-store' });
        if (!resp.ok) throw new Error('Not found');
        const text = await resp.text();
        currentData = parseCsvText(text);
        buildFilters(currentData);
        plotRoutes(currentData);
        const uniqueRoutes = Array.from(new Set(currentData.map(r => String(r.route_id)))).length;
        statusText.textContent = `Loaded ${currentData.length} rows • ${uniqueRoutes} routes`;
      } catch (e) {
        statusText.textContent = 'Could not load work_orders.csv.';
        showToast('Failed to load work orders', 'error');
      }
    }

    routeFilter.addEventListener('change', () => currentData && plotRoutes(currentData));
    chkDetections.addEventListener('change', () => {
      detectionsLayer.clearLayers();
      if (chkDetections.checked) loadDetections();
    });

    // Try loading by default on first visit
    // Load saved colors and meta first, then detections and routes
    Promise.all([
      fetch('/api/routes/colors').then(r => r.ok ? r.json() : { colors: {} }).then(data => { savedRouteColors = data.colors || {}; }).catch(() => { savedRouteColors = {}; }),
      fetch('/api/routes/meta').then(r => r.ok ? r.json() : {}).then(meta => { workOrdersMeta = meta || {}; }).catch(() => { workOrdersMeta = {}; })
    ]).finally(() => {
      loadDetections();
      loadDefault();
    });

    btnReload.addEventListener('click', () => { setSpinner(true); Promise.all([loadDetections(), loadDefault()]).finally(() => setSpinner(false)); });
    // Mobile panel toggle
    const btnTogglePanel = document.getElementById('btnTogglePanel');
    const panel = document.getElementById('panel');
    btnTogglePanel?.addEventListener('click', () => {
      if (!panel) return;
      const hidden = panel.classList.toggle('hidden');
      btnTogglePanel.querySelector('span').textContent = hidden ? 'Filters & Legend' : 'Close Panel';
    });
    document.getElementById('btnResetAllColors')?.addEventListener('click', async () => {
      try {
        setSpinner(true);
        // Single server call clears persisted colors to avoid race conditions
        await fetch('/api/routes/colors/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
      } catch (_) {}
      // Locally reset all visible styles and state
      const routeIds = Array.from(routeLayers.keys());
      routeIds.forEach(rid => {
        const obj = routeLayers.get(rid);
        if (obj) {
          try { obj.polyline.setStyle({ color: DEFAULT_ROUTE_COLOR }); } catch (_) { }
          obj.markers.forEach(m => { try { m.setStyle({ color: DEFAULT_ROUTE_COLOR, fillColor: DEFAULT_ROUTE_COLOR }); } catch (_) { } });
          obj.color = DEFAULT_ROUTE_COLOR;
        }
        savedRouteColors[String(rid)] = DEFAULT_ROUTE_COLOR;
      });
      renderLegendSummary();
      showToast('Reset all route colors', 'info');
      setSpinner(false);
    });

    // SSE for live updates
    try {
      if ('EventSource' in window) {
        let es;
        let reconnectDelay = 1000;
        const connect = () => {
          es = new EventSource('/events');
          es.onopen = () => { sseDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-emerald-400'; reconnectDelay = 1000; };
          es.onerror = () => { sseDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-yellow-400'; try { es.close(); } catch (_) { }; setTimeout(connect, Math.min(10000, reconnectDelay)); reconnectDelay *= 2; };
          es.onmessage = (ev) => {
            try {
              const msg = JSON.parse(ev.data);
              if (msg && msg.type === 'routesUpdated') {
                setSpinner(true);
                loadDefault().finally(() => setSpinner(false));
                showToast('Routes updated', 'success');
              }
            } catch (_) { }
          };
        };
        connect();
      }
    } catch (e) { /* ignore */ }

    function parseDetectionsCsv(text) {
      const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
      return parsed.data.map(r => ({
        detection_id: r.detection_id || r.id,
        device_id: r.device_id,
        cls: r.cls || r.class || 'Pothole',
        start_timestamp: r.start_timestamp || r.timestamp || r.start,
        end_timestamp: r.end_timestamp || r.end,
        duration_s: Number(r.duration_s || r.duration || 0),
        lat: parseFloat(r.lat || r.latitude),
        lon: parseFloat(r.lon || r.longitude),
        confidence: r.confidence_peak || r.confidence,
        image_url: r.image_url || r.image,
      })).filter(d => !isNaN(d.lat) && !isNaN(d.lon));
    }

    async function loadDetections() {
      try {
        const resp = await fetch('/detections.csv', { cache: 'no-store' });
        if (!resp.ok) return;
        const text = await resp.text();
        const dets = parseDetectionsCsv(text);
        const color = '#f43f5e'; // active source color
        detMarkers = [];
        dets.forEach(d => {
          const baseRadius = 4 + Math.min(8, Math.max(0, (parseFloat(d.confidence || 0) || 0) * 6));
          const m = L.circleMarker([d.lat, d.lon], { radius: baseRadius, color, fillColor: color, fillOpacity: 0.35, pane: 'detections' }).addTo(detectionsLayer);
          const dur = isNaN(d.duration_s) ? '' : `${Number(d.duration_s).toFixed(0)}s`;
          const conf = d.confidence != null ? `Conf: ${Number(d.confidence).toFixed(2)}` : '';
          const img = d.image_url ? `<div class="mt-1"><img src="${d.image_url}" alt="detection" class="max-w-[180px] rounded"/></div>` : '';
          m.bindPopup(`<div><b>${d.cls || 'Pothole'}</b><br>${d.device_id || ''}<br>${d.start_timestamp || ''}${d.end_timestamp ? ' → ' + d.end_timestamp : ''}<br>${[dur, conf].filter(Boolean).join(' • ')}${img}</div>`);
          m.on('popupopen', () => {
            try {
              const pop = m.getPopup();
              const root = pop && pop.getElement ? pop.getElement() : null;
              const content = root ? root.querySelector('.leaflet-popup-content') : null;
              if (content && !content.querySelector('[data-action="fill"]')) {
                const wrap = document.createElement('div');
                wrap.className = 'mt-2';
                const btn = document.createElement('button');
                btn.className = 'text-xs px-2 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white';
                btn.setAttribute('data-action', 'fill');
                btn.textContent = 'Mark Filled';
                btn.addEventListener('click', async (ev) => {
                  ev.preventDefault();
                  setSpinner(true);
                  statusText.textContent = 'Marking pothole filled…';
                  try {
                    const payload = (d.detection_id) ? { detection_id: d.detection_id } : { lat: d.lat, lon: d.lon };
                    const resp2 = await fetch('/api/detections/fix', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const j = await resp2.json();
                    if (!resp2.ok) throw new Error(j?.error || 'Request failed');
                    showToast(`Pothole filled. Removed ${j.removed}${j.supabase_removed ? ' (+'+j.supabase_removed+' from Supabase)' : ''}`, 'success');
                    await loadDetections();
                    await loadDefault();
                  } catch (e) {
                    showToast(`Failed to mark filled: ${e}`, 'error');
                  } finally {
                    setSpinner(false);
                  }
                }, { once: true });
                wrap.appendChild(btn);
                content.appendChild(wrap);
              }
            } catch (_) {}
          });
          detMarkers.push({ marker: m, baseRadius });
        });
        updateDetectionMarkerSizes();
      } catch (e) {
      }
    }

    loadDetections();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(()=>{});
      });
    }
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
