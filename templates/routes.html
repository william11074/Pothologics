<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRATER • Repair Routes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body class="bg-dark min-h-screen">
  <nav class="fixed top-0 left-0 right-0 z-50 bg-dark/90 backdrop-blur-sm shadow-lg py-4">
    <div class="container mx-auto px-4 flex justify-between items-center">
      <div class="text-2xl font-bold text-white"><span class="gradient-text"><a href="./">C.R.A.T.E.R</a></span></div>
      <div class="hidden md:flex space-x-8">
        <a href="./#section1" class="nav-link text-gray-300 hover:text-white font-medium">AI Detection</a>
        <a href="./#section2" class="nav-link text-gray-300 hover:text-white font-medium">Data Analysis</a>
      </div>
    </div>
  </nav>

  <main class="container mx-auto px-4 pt-28 pb-6">
    <h1 class="text-3xl md:text-4xl font-bold text-white mb-4"><span class="gradient-text">Repair Routes</span></h1>
    <p class="text-gray-300 mb-4">Loads routes from <code>work_orders.csv</code> (generated by main.py) and plots them
      on an interactive map. You can also load a CSV manually.</p>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
      <!-- Controls -->
      <div class="lg:col-span-1 bg-slate-900/60 border border-slate-800 rounded-xl p-4 space-y-4">
        <div class="space-y-2">
          <button id="btnLoadDefault"
            class="w-full bg-primary hover:bg-blue-500 text-white px-3 py-2 rounded-lg font-medium flex items-center justify-center"><i
              class="fa-solid fa-file-csv mr-2"></i> Load work_orders.csv</button>
          <label class="block text-gray-300 text-sm">Or choose CSV</label>
          <input type="file" id="fileInput" accept=".csv" class="w-full text-gray-200" />
          <div id="status" class="text-sm text-gray-400">Waiting for CSV…</div>
        </div>

        <div class="border-t border-slate-800 pt-3">
          <h2 class="text-white font-semibold mb-2">Filters</h2>
          <label class="block text-gray-300 text-sm mb-1">Crew</label>
          <select id="crewFilter" class="w-full bg-slate-800 text-gray-200 rounded-lg px-2 py-1">
            <option value="">All</option>
          </select>
          <label class="block text-gray-300 text-sm mt-3 mb-1">Route</label>
          <select id="routeFilter" class="w-full bg-slate-800 text-gray-200 rounded-lg px-2 py-1">
            <option value="">All</option>
          </select>
        </div>

        <div class="border-t border-slate-800 pt-3">
          <h2 class="text-white font-semibold mb-2">Legend</h2>
          <div id="legend" class="space-y-1 text-sm text-gray-300"></div>
        </div>
      </div>

      <!-- Map -->
      <div class="lg:col-span-3">
        <div id="map" class="w-full h-[70vh] rounded-xl border border-slate-800"></div>
      </div>
    </div>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const fileInput = document.getElementById('fileInput');
    const btnLoadDefault = document.getElementById('btnLoadDefault');
    const crewFilter = document.getElementById('crewFilter');
    const routeFilter = document.getElementById('routeFilter');
    const legend = document.getElementById('legend');

    // Leaflet map
    const map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const colors = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'];
    let routeLayers = new Map(); // route_id -> {polyline, markers:[], color}
    let currentData = null;

    function clearMap() {
      for (const [, obj] of routeLayers) {
        map.removeLayer(obj.polyline);
        obj.markers.forEach(m => map.removeLayer(m));
      }
      routeLayers.clear();
    }

    function buildFilters(data) {
      const crews = Array.from(new Set(data.map(r => r.crew_assignment).filter(Boolean))).sort();
      crewFilter.innerHTML = '<option value="">All</option>' + crews.map(c => `<option value="${c}">${c}</option>`).join('');
      const routes = Array.from(new Set(data.map(r => r.route_id))).sort((a, b) => a - b);
      routeFilter.innerHTML = '<option value="">All</option>' + routes.map(r => `<option value="${r}">${r}</option>`).join('');
    }

    function applyFilters(data) {
      const crew = crewFilter.value;
      const route = routeFilter.value;
      return data.filter(r => (!crew || r.crew_assignment === crew) && (!route || String(r.route_id) === String(route)));
    }

    function plotRoutes(data) {
      clearMap();
      if (!data.length) return;
      const filtered = applyFilters(data);
      const grouped = new Map();
      filtered.forEach(r => {
        const id = r.route_id;
        if (!grouped.has(id)) grouped.set(id, []);
        grouped.get(id).push(r);
      });

      let bounds = [];
      legend.innerHTML = '';

      Array.from(grouped.keys()).sort((a, b) => a - b).forEach((routeId, idx) => {
        const pts = grouped.get(routeId).sort((a, b) => Number(a.route_order) - Number(b.route_order));
        const color = colors[idx % colors.length];
        const latlngs = pts.map(p => [parseFloat(p.latitude), parseFloat(p.longitude)]);
        if (latlngs.length === 0) return;
        const line = L.polyline(latlngs, { color, weight: 3, opacity: 0.8 }).addTo(map);
        const markers = pts.map((p, i) => {
          const m = L.circleMarker([parseFloat(p.latitude), parseFloat(p.longitude)], { radius: 5, color, fillColor: color, fillOpacity: 0.8 }).addTo(map);
          const sev = p.severity ?? 'N/A';
          const rep = p.report_date ?? 'N/A';
          m.bindPopup(`<div><b>Route ${routeId}</b><br>#${i + 1}<br>Severity: ${sev}<br>Report: ${rep}</div>`);
          return m;
        });
        routeLayers.set(routeId, { polyline: line, markers, color });
        latlngs.forEach(ll => bounds.push(ll));
        // Legend
        const stats = pts[0];
        const km = stats.total_km ?? '—';
        const mins = stats.total_time_mins ?? '—';
        const crew = stats.crew_assignment ?? '—';
        const row = document.createElement('div');
        row.innerHTML = `<span class="inline-block w-3 h-3 mr-2 rounded" style="background:${color}"></span><span class="text-gray-200">Route ${routeId} • Crew: ${crew} • ${km} km • ${mins} mins</span>`;
        legend.appendChild(row);
      });

      if (bounds.length) map.fitBounds(bounds, { padding: [20, 20] });
    }

    function parseCsvText(text) {
      const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
      // Normalize field names used in plotting
      const rows = parsed.data.map(r => ({
        route_id: r.route_id ?? r.Route_ID ?? r.route ?? r.RouteId,
        crew_assignment: r.crew_assignment ?? r.Crew ?? r.crew,
        route_order: r.route_order ?? r.Order ?? r.order,
        latitude: r.latitude ?? r.lat,
        longitude: r.longitude ?? r.lon,
        severity: r.severity,
        report_date: r.report_date,
        total_km: r.total_km,
        total_time_mins: r.total_time_mins,
      }));
      return rows.filter(r => r.route_id != null && r.latitude != null && r.longitude != null);
    }

    async function loadDefault() {
      statusEl.textContent = 'Loading work_orders.csv…';
      try {
        const resp = await fetch('/work_orders.csv', { cache: 'no-store' });
        if (!resp.ok) throw new Error('Not found');
        const text = await resp.text();
        currentData = parseCsvText(text);
        buildFilters(currentData);
        plotRoutes(currentData);
        statusEl.textContent = `Loaded ${currentData.length} rows`;
      } catch (e) {
        statusEl.textContent = 'Could not load work_orders.csv. Use file picker.';
      }
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      statusEl.textContent = 'Parsing CSV…';
      const text = await file.text();
      currentData = parseCsvText(text);
      buildFilters(currentData);
      plotRoutes(currentData);
      statusEl.textContent = `Loaded ${currentData.length} rows from ${file.name}`;
    });

    btnLoadDefault.addEventListener('click', loadDefault);
    crewFilter.addEventListener('change', () => currentData && plotRoutes(currentData));
    routeFilter.addEventListener('change', () => currentData && plotRoutes(currentData));

    // Try loading by default on first visit
    loadDefault();
  </script>
</body>

</html>
