<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Pothole Repair Map (Embed)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>
        const map = L.map('map', { zoomControl: true }).setView([37.7749, -122.4194], 12);
        const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Panes so routes draw above detections/markers
        // routes go above detections so they are more visible
        map.createPane('detections');
        map.getPane('detections').style.zIndex = 590; 
        map.createPane('routes');
        map.getPane('routes').style.zIndex = 640;

        const detectionsLayer = L.layerGroup().addTo(map); // individual detections
        let detMarkers = [];
        function styleForPothole(f) {
            const sev = String((f.properties?.severity ?? '')).toLowerCase();
            const color =
                sev === 'high' ? '#d32f2f' :
                sev === 'medium' ? '#f57c00' :
                sev === 'low' ? '#388e3c' : '#5e35b1';
            return { radius: 5, color, weight: 1.5, fillColor: color, fillOpacity: 0.7 };
        }

        const routeLayer = L.geoJSON(null, {
            pane: 'routes',
            style: f => ({
                color: f?.properties?.color || '#1976d2',
                weight: f?.properties?.weight || 5,
                opacity: f?.properties?.opacity ?? 0.9
            })
        }).addTo(map);

        // Redunadant, used for testing
        const vehicleLayer = L.geoJSON(null, {
            pointToLayer: (f, latlng) => L.circleMarker(latlng, {
                radius: 6, color: '#222', fillColor: '#ffd54f', fillOpacity: 0.9, weight: 1
            }).bindPopup(`Crew: ${f.properties?.name || 'N/A'}`)
        }).addTo(map);

        function updateDetectionMarkerSizes() {
            const z = map.getZoom ? map.getZoom() : 13;
            const scale = Math.pow(1.2, (z - 13));
            detMarkers.forEach(({ marker, baseRadius }) => {
                const r = Math.max(2, Math.min(12, baseRadius * scale));
                try { marker.setStyle({ radius: r }); } catch (e) {}
            });
        }
        map.on('zoomend', updateDetectionMarkerSizes);

        function popupForPothole(f) {
            const p = f.properties || {};
            return `
        <b>Pothole #${p.id ?? '—'}</b><br/>
        Severity: ${p.severity ?? '—'}<br/>
        Status: ${p.status ?? 'unknown'}<br/>
        Reported: ${p.reported_at ?? '—'}
      `;
        }

        /***************
         * Live Update API (for parent window via postMessage)
         *
         * Post messages to this iframe’s contentWindow with:
        *  - { type: 'addPotholes', features: [GeoJSON Point Features] }
         *  - { type: 'addRoute', feature: GeoJSON LineString/MultiLineString }
         *  - { type: 'addVehicles', features: [GeoJSON Point Features] }
         *  - { type: 'replacePotholes', featureCollection: GeoJSON FeatureCollection }
         *  - { type: 'replaceRoute', feature: GeoJSON LineString/MultiLineString }
         *  - { type: 'clear', layer: 'potholes'|'routes'|'vehicles'|'all' }
         *  - { type: 'fit', target: 'potholes'|'routes'|'vehicles'|'all', padding: 40 }
         *  - { type: 'setView', center: [lng, lat], zoom: 13 }
         *  - { type: 'setTiles', urlTemplate: 'https://{s}.tile...', options: {...} }
         *  - { type: 'ping' } -> will reply with { type: 'pong' }
         ***************/
        window.addEventListener('message', (event) => {
            const msg = event.data || {};
            try {
                switch (msg.type) {
                    case 'ping':
                        return event.source?.postMessage({ type: 'pong' }, event.origin || '*');

                    case 'addPotholes': {
                        const feats = asArray(msg.features).filter(isFeature);
                        feats.forEach(f => potholeLayer.addData(f));
                        break;
                    }

                    case 'replacePotholes': {
                        potholeLayer.clearLayers();
                        const fc = msg.featureCollection;
                        if (isFeatureCollection(fc)) potholeLayer.addData(fc);
                        break;
                    }

                    case 'addRoute': {
                        const ft = msg.feature;
                        if (isFeature(ft)) routeLayer.addData(ft);
                        break;
                    }

                    case 'replaceRoute': {
                        routeLayer.clearLayers();
                        const ft = msg.feature;
                        if (isFeature(ft)) routeLayer.addData(ft);
                        break;
                    }

                    case 'addVehicles': {
                        const feats = asArray(msg.features).filter(isFeature);
                        feats.forEach(f => vehicleLayer.addData(f));
                        break;
                    }

                    case 'clear': {
                        const layer = (msg.layer || 'all').toLowerCase();
                        if (layer === 'potholes' || layer === 'all') potholeLayer.clearLayers();
                        if (layer === 'routes' || layer === 'all') routeLayer.clearLayers();
                        if (layer === 'vehicles' || layer === 'all') vehicleLayer.clearLayers();
                        break;
                    }

                    case 'fit': {
                        const target = (msg.target || 'all').toLowerCase();
                        let group = L.featureGroup([]);
                        if (target === 'potholes' || target === 'all') group.addLayer(potholeLayer);
                        if (target === 'routes' || target === 'all') group.addLayer(routeLayer);
                        if (target === 'vehicles' || target === 'all') group.addLayer(vehicleLayer);
                        const padding = Number(msg.padding ?? 40);
                        const b = group.getBounds();
                        if (b.isValid()) map.fitBounds(b, { padding: [padding, padding] });
                        break;
                    }

                    case 'setView': {
                        const [lng, lat] = msg.center || [];
                        const zoom = msg.zoom ?? map.getZoom();
                        if (Number.isFinite(lng) && Number.isFinite(lat)) map.setView([lat, lng], zoom);
                        break;
                    }

                    case 'setTiles': {
                        if (msg.urlTemplate) {
                            map.removeLayer(tiles);
                            L.tileLayer(msg.urlTemplate, msg.options || { maxZoom: 20 }).addTo(map);
                        }
                        break;
                    }
                }
            } catch (e) {
                console.error('Update error:', e);
            }
        });

        function asArray(v) { return Array.isArray(v) ? v : (v ? [v] : []); }
        function isFeature(obj) { return obj && obj.type === 'Feature' && obj.geometry; }
        function isFeatureCollection(obj) { return obj && obj.type === 'FeatureCollection' && Array.isArray(obj.features); }

        // Server side events for real time updates
        const urlParams = new URLSearchParams(window.location.search);
        const ENABLE_SSE = urlParams.get('sse') === '1' || window.ENABLE_SSE === true;

        if (ENABLE_SSE && 'EventSource' in window) {
            try {
                const esUrl = urlParams.get('sse_url') || '/events';
                const es = new EventSource(esUrl);
                es.onmessage = (ev) => {
                    try {
                        const msg = JSON.parse(ev.data);
                        window.postMessage(msg, '*');
                        if (msg.type === 'routesUpdated' && msg.url) {
                            fetch(msg.url, { cache: 'no-store' })
                                .then(r => r.text())
                                .then(csv => {
                                    const rows = csv.split(/\r?\n/);
                                    const header = (rows.shift() || '').split(',').map(h => h.trim());
                                    const idx = {
                                        route_id: header.findIndex(h => h.toLowerCase() === 'route_id'),
                                        lat: header.findIndex(h => h.toLowerCase() === 'latitude' || h.toLowerCase() === 'lat'),
                                        lon: header.findIndex(h => h.toLowerCase() === 'longitude' || h.toLowerCase() === 'lon'),
                                        order: header.findIndex(h => h.toLowerCase() === 'route_order' || h.toLowerCase() === 'order')
                                    };
                                    const data = rows.filter(Boolean).map(line => {
                                        const parts = line.split(',');
                                        return {
                                            route_id: parts[idx.route_id],
                                            latitude: parseFloat(parts[idx.lat]),
                                            longitude: parseFloat(parts[idx.lon]),
                                            route_order: parseInt(parts[idx.order] || '0', 10)
                                        };
                                    }).filter(r => Number.isFinite(r.latitude) && Number.isFinite(r.longitude));

                                    routeLayer.clearLayers();
                                    const grouped = {};
                                    data.forEach(r => {
                                        grouped[r.route_id] ||= [];
                                        grouped[r.route_id].push(r);
                                    });
                                    Object.keys(grouped).sort((a, b) => Number(a) - Number(b)).forEach((rid, i) => {
                                        const pts = grouped[rid].sort((a, b) => a.route_order - b.route_order);
                                        const latlngs = pts.map(p => [p.latitude, p.longitude]);
                                        if (latlngs.length) {
                                            L.polyline(latlngs, { color: ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728'][i % 4], weight: 4, opacity: 0.9 }).addTo(routeLayer);
                                        }
                                    });

                                    const b = routeLayer.getBounds();
                                    if (b.isValid()) map.fitBounds(b, { padding: [20, 20] });
                                })
                                .catch(err => console.warn('Failed to refresh routes:', err));
                        }
                    } catch (e) { console.warn('Bad SSE payload', e); }
                };
                es.onerror = (err) => console.warn('SSE error', err);
            } catch (e) {
                console.warn('SSE setup failed', e);
            }
        }

        window.debugAddRandom = function () {
            const center = map.getCenter();
            const jitter = () => (Math.random() - 0.5) * 0.01;
            const f = {
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [center.lng + jitter(), center.lat + jitter()] },
                properties: { id: Math.floor(Math.random() * 1e6), severity: ['low', 'medium', 'high'][Math.floor(Math.random() * 3)], status: 'new' }
            };
            potholeLayer.addData(f);
        };

        function parseDetectionsCsv(text) {
            const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
            return parsed.data.map(r => ({
                detection_id: r.detection_id || r.id,
                device_id: r.device_id,
                cls: r.cls || r.class || 'Pothole',
                start_timestamp: r.start_timestamp || r.timestamp || r.start,
                end_timestamp: r.end_timestamp || r.end,
                duration_s: Number(r.duration_s || r.duration || 0),
                lat: parseFloat(r.lat || r.latitude),
                lon: parseFloat(r.lon || r.longitude),
                confidence: r.confidence_peak || r.confidence,
                image_url: r.image_url || r.image,
            })).filter(d => Number.isFinite(d.lat) && Number.isFinite(d.lon));
        }

        async function loadDetections() {
            try {
                detMarkers = [];
                detectionsLayer.clearLayers();
                const resp = await fetch('/detections.csv', { cache: 'no-store' });
                if (!resp.ok) return;
                const txt = await resp.text();
                const dets = parseDetectionsCsv(txt);
                const color = '#f43f5e';
                dets.forEach(d => {
                    const baseRadius = 4 + Math.min(8, Math.max(0, (parseFloat(d.confidence || 0) || 0) * 6));
                    const m = L.circleMarker([d.lat, d.lon], { radius: baseRadius, color, fillColor: color, fillOpacity: 0.35, pane: 'detections' }).addTo(detectionsLayer);
                    const dur = isNaN(d.duration_s) ? '' : `${Number(d.duration_s).toFixed(0)}s`;
                    const conf = d.confidence != null ? `Conf: ${Number(d.confidence).toFixed(2)}` : '';
                    const img = d.image_url ? `<div class=\"mt-1\"><img src=\"${d.image_url}\" alt=\"detection\" class=\"max-w-[180px] rounded\"/></div>` : '';
                    m.bindPopup(`<div><b>${d.cls || 'Pothole'}</b><br>${d.device_id || ''}<br>${d.start_timestamp || ''}${d.end_timestamp ? ' → ' + d.end_timestamp : ''}<br>${[dur, conf].filter(Boolean).join(' • ')}${img}</div>`);
                    detMarkers.push({ marker: m, baseRadius });
                });
                updateDetectionMarkerSizes();
            } catch (e) {
                console.warn('detections load failed', e);
            }
        }

        loadDetections();
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(()=>{});
          });
        }
        async function loadRoutesFromCsv(url) {
            try {
                const resp = await fetch(url, { cache: 'no-store' });
                if (!resp.ok) throw new Error('Fetch failed');
                const csv = await resp.text();
                const rows = csv.split(/\r?\n/);
                const header = (rows.shift() || '').split(',').map(h => h.trim());
                const idx = {
                    route_id: header.findIndex(h => h.toLowerCase() === 'route_id'),
                    lat: header.findIndex(h => h.toLowerCase() === 'latitude' || h.toLowerCase() === 'lat'),
                    lon: header.findIndex(h => h.toLowerCase() === 'longitude' || h.toLowerCase() === 'lon'),
                    order: header.findIndex(h => h.toLowerCase() === 'route_order' || h.toLowerCase() === 'order')
                };
                const data = rows.filter(Boolean).map(line => {
                    const parts = line.split(',');
                    return {
                        route_id: parts[idx.route_id],
                        latitude: parseFloat(parts[idx.lat]),
                        longitude: parseFloat(parts[idx.lon]),
                        route_order: parseInt(parts[idx.order] || '0', 10)
                    };
                }).filter(r => Number.isFinite(r.latitude) && Number.isFinite(r.longitude));

                routeLayer.clearLayers();
                const grouped = {};
                data.forEach(r => { (grouped[r.route_id] ||= []).push(r); });
                Object.keys(grouped).sort((a, b) => Number(a) - Number(b)).forEach((rid, i) => {
                    const pts = grouped[rid].sort((a, b) => a.route_order - b.route_order);
                    const latlngs = pts.map(p => [p.latitude, p.longitude]);
                    if (latlngs.length) {
                        L.polyline(latlngs, { color: ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728'][i % 4], weight: 4, opacity: 0.9 }).addTo(routeLayer);
                    }
                });
                const b = routeLayer.getBounds();
                if (b.isValid()) map.fitBounds(b, { padding: [20, 20] });
            } catch (e) {
                console.warn('Failed to load CSV', url, e);
            }
        }

        (function initCsvLoad() {
            const url = new URLSearchParams(window.location.search).get('csv') || '/work_orders.csv';
            loadRoutesFromCsv(url);
        })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
</body>

</html>
